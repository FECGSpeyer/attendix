# Sol-Postbote for attendix on the TrueNAS (docs/sol-postbote.md): fetches Sol reviews for pull
# requests with the label `review:sol` and posts them as a comment, with two ChatGPT accounts and an
# automatic switch when one runs out. Adapted from Lionhunt3r/werkbank (ops/sol-postbote there),
# review mode only (no implementation mode, no push token). Install as a second TrueNAS custom app
# `sol-postbote-attendix` via "Apps -> Discover Apps -> Custom App -> Install via YAML" and replace
# SET-IN-TRUENAS there, nowhere else; this file never holds a secret. The two Codex logins live in
# the volumes codex-a and codex-b of this app and are made once by hand (docs/sol-postbote.md, step 3).
#
# Two services, so that the container that runs Codex never holds the key:
# - `attendix-token` alone holds the key of the GitHub App (the werkbank-postbote app, also installed
#   on this repository). It mints a one-hour token for this repository only, downscoped to pull
#   requests and issues: write, contents: read, and fetches ops/sol-postbote/postbote.sh, both into
#   the volume `ctl`.
# - `attendix-postbote` has the token and the script (volume `ctl`, read-only) but never the key. It
#   runs one pass of the script per round as the unprivileged user `node`; the script starts Codex in
#   its read-only sandbox (no write, no network) without the token.
# Codex's sandbox (bubblewrap) needs user namespaces and mounts, which Docker's default seccomp and
# AppArmor profiles forbid. Only `attendix-postbote` runs without them (security_opt below); the
# sandbox self-test of the script proves before every pass that writes and network stay shut.

x-codex-version: &codex-version "0.164.0"

services:
  # Holds the app key; Docker's default security profiles stay on.
  attendix-token:
    image: node:24.22.1-trixie-slim
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      REPO: Lionhunt3r/attendix
      TZ: Europe/Berlin
      # The GitHub App (docs/sol-postbote.md, step 1). Fill in only in the TrueNAS app editor.
      APP_ID: "SET-IN-TRUENAS"
      # The app's private key as one line of base64 (base64 -i key.pem | tr -d '\n').
      APP_PRIVATE_KEY_B64: "SET-IN-TRUENAS"
      # Which branch the script comes from. `master` in operation; a branch name only to try a change.
      SCRIPT_REF: master
      # Seconds between two refreshes of token and script (the token lives one hour; a pass starts
      # only with a token of at most 15 minutes, so it keeps 45 minutes, as long as a review may run).
      REFRESH_SECONDS: "600"
    volumes:
      - ctl:/ctl
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        # Placeholders left: wait before installing anything, so the restart loop stays quiet.
        if [ "$$APP_ID" = SET-IN-TRUENAS ] || [ "$$APP_PRIVATE_KEY_B64" = SET-IN-TRUENAS ]; then
          echo "APP_ID and APP_PRIVATE_KEY_B64 are not filled in yet (docs/sol-postbote.md, steps 1 and 2); waiting" >&2
          sleep 300
          exit 1
        fi
        # A key that does not decode would crash the script in a tight restart loop; stay quiet instead.
        if ! printf %s "$$APP_PRIVATE_KEY_B64" | tr -d '[:space:]"' | base64 -d >/dev/null 2>&1; then
          echo "APP_PRIVATE_KEY_B64 is not valid base64 (one line, starts with LS0tLS1CRUdJTi, no quotes); waiting" >&2
          sleep 300
          exit 1
        fi
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl jq openssl tzdata >/dev/null
        umask 077
        printf %s "$$APP_PRIVATE_KEY_B64" | tr -d '[:space:]"' | base64 -d > /root/app.pem
        if ! openssl pkey -in /root/app.pem -noout >/dev/null 2>&1; then
          echo "APP_PRIVATE_KEY_B64 decodes, but not to a private key (is it the PEM of the app?); waiting" >&2
          sleep 300
          exit 1
        fi
        # The directory belongs to the group `node`, which reads the script; written below.
        mkdir -p /ctl
        chown root:node /ctl
        chmod 0750 /ctl
        api="https://api.github.com"
        b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
        # A JWT of the app, then a one-hour installation token restricted to this repository and to
        # pull requests and issues: write, contents: read (even if the app may do more elsewhere).
        app_token() {
          now=$$(date +%s)
          unsigned="$$(printf '{"alg":"RS256","typ":"JWT"}' | b64url).$$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' $$((now - 60)) $$((now + 540)) "$$APP_ID" | b64url)"
          jwt="$$unsigned.$$(printf %s "$$unsigned" | openssl dgst -sha256 -sign /root/app.pem | b64url)"
          installation=$$(curl -fsS -H "Authorization: Bearer $$jwt" -H "Accept: application/vnd.github+json" "$$api/repos/$$REPO/installation" | jq -r .id)
          curl -fsS -X POST -H "Authorization: Bearer $$jwt" -H "Accept: application/vnd.github+json" \
            "$$api/app/installations/$$installation/access_tokens" \
            -d "{\"repositories\":[\"$${REPO#*/}\"],\"permissions\":{\"issues\":\"write\",\"pull_requests\":\"write\",\"contents\":\"read\"}}" | jq -r .token
        }
        case "$$SCRIPT_REF" in
          *[!A-Za-z0-9._/-]*) echo "SCRIPT_REF has odd characters" >&2; exit 1 ;;
        esac
        while true; do
          token="$$(app_token)" || token=""
          if [ -z "$$token" ] || [ "$$token" = null ]; then
            echo "no app token, retrying in 60 s (is the app installed on $$REPO?)" >&2
            sleep 60
            continue
          fi
          # The newest script of the branch; the last good copy stays when a fetch fails.
          if curl -fsS -H "Authorization: Bearer $$token" -H "Accept: application/vnd.github.raw" \
            "$$api/repos/$$REPO/contents/ops/sol-postbote/postbote.sh?ref=$$SCRIPT_REF" -o /ctl/postbote.sh.new; then
            chgrp node /ctl/postbote.sh.new
            chmod 0640 /ctl/postbote.sh.new
            mv /ctl/postbote.sh.new /ctl/postbote.sh
          fi
          # The token last, atomically: its age tells the pass how fresh it is.
          # Only root reads it: Codex runs as other users and the pass gets it from the loop.
          printf %s "$$token" > /ctl/token.new
          chmod 0600 /ctl/token.new
          mv /ctl/token.new /ctl/token
          sleep "$$REFRESH_SECONDS"
        done
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # Runs the passes and Codex; never sees the app key.
  attendix-postbote:
    image: node:24.22.1-trixie-slim
    restart: always
    security_opt:
      - no-new-privileges:true
      # bubblewrap, which Codex uses for its read-only sandbox, needs user namespaces and mounts;
      # Docker's default seccomp and AppArmor profiles forbid both (measured for werkbank on the
      # TrueNAS, 23.10.2026): these two, without systempaths or extra capabilities.
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      REPO: Lionhunt3r/attendix
      BASE: master
      TZ: Europe/Berlin
      CODEX_VERSION: *codex-version
      # Seconds between two passes.
      POLL_SECONDS: "300"
      # Preferred account (a or b) and the hand switch (auto, a or b). The file /state/konto beats
      # SOL_KONTO, and a line `Konto: A` in a Sol-Auftrag beats both for that one review.
      SOL_PREFERRED: "a"
      SOL_KONTO: "auto"
      # First block of an account with an empty quota in minutes; it doubles per repeated hit up to 4 h.
      SOL_BLOCK_MIN: "60"
    volumes:
      - codex-a:/codex/a
      - codex-b:/codex/b
      - state:/state
      - work:/work
      - ctl:/ctl:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        umask 022
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl git gh jq tzdata util-linux >/dev/null
        npm install -g --silent "@openai/codex@$$CODEX_VERSION"
        # Codex runs as one user per account (the pass, `node`, switches to them, see postbote.sh):
        # it reads neither the token, nor the environment of the pass, nor the other login.
        id sola >/dev/null 2>&1 || useradd -r -M -u 1101 -d /codex/a -s /usr/sbin/nologin sola
        id solb >/dev/null 2>&1 || useradd -r -M -u 1102 -d /codex/b -s /usr/sbin/nologin solb
        mkdir -p /codex/a /codex/b /state /work
        chown -R sola:sola /codex/a
        chown -R solb:solb /codex/b
        chmod 0700 /codex/a /codex/b
        chown -R node:node /state
        chown node:node /work
        [ ! -d /work/attendix ] || chown -R node:node /work/attendix
        [ ! -d /work/attendix ] || chmod -R a+rX /work/attendix
        while true; do
          # Token and script come from attendix-token; a token older than 15 minutes is not used.
          if [ -s /ctl/token ] && [ -s /ctl/postbote.sh ] && [ $$(( $$(date +%s) - $$(stat -c %Y /ctl/token) )) -lt 900 ]; then
            token="$$(cat /ctl/token)"
            # node keeps the capabilities to switch to the Codex users (setuid, setgid); docs/sol-postbote.md, Sicherheit, names the limits.
            setpriv --reuid=node --regid=node --init-groups --inh-caps=+setuid,+setgid --ambient-caps=+setuid,+setgid env -i \
              PATH=/usr/local/bin:/usr/bin:/bin HOME=/home/node TZ="$$TZ" \
              GH_TOKEN="$$token" REPO="$$REPO" BASE="$$BASE" STATE=/state WT=/work/attendix CODEX_ACCOUNTS=/codex \
              SOL_DROP=1 SOL_UID_BASE=1100 CTL_TOKEN=/ctl/token \
              SOL_PREFERRED="$$SOL_PREFERRED" SOL_KONTO="$$SOL_KONTO" SOL_BLOCK_MIN="$$SOL_BLOCK_MIN" \
              /bin/bash /ctl/postbote.sh || echo "pass failed (exit $$?)" >&2
          else
            echo "no fresh token or script from attendix-token yet (is it running? are the app values set there?)" >&2
          fi
          sleep "$$POLL_SECONDS"
        done
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

volumes:
  codex-a:
  codex-b:
  state:
  work:
  ctl:

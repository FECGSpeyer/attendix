<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Attendix – Anwesenheit, Termine und Werke für Orchester, Chöre und Gruppen">

  <!-- PWA_PARITY: same head as the Ionic PWA (src/index.html): colour
       scheme, white theme colour, black iOS status bar, title "Attendix". -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Attendix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <!-- PWA_PARITY: Ionic's 256px favicon (assets/icon/favicon.png) -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Attendix</title>
  <link rel="manifest" href="manifest.json">
  <!-- Start loading the app code right away, in parallel with the bootstrap
       script (it would otherwise only be requested after flutter_bootstrap.js).
       PWA_WASM: preload the variant Flutter's loader will pick – WebAssembly
       for Chrome/Edge (and Safari 26.2+), JavaScript elsewhere – with the same
       browser checks as flutter.js, so no browser downloads both. -->
  <script>
    (function () {
      var ua = navigator.userAgent;
      var engine = navigator.vendor === 'Google Inc.' || ua.indexOf('Edg/') >= 0
        ? 'blink'
        : navigator.vendor === 'Apple Computer, Inc.' ? 'webkit' : 'other';
      var safariWasm = false;
      if (engine === 'webkit') {
        var m = /Version\/(\d+)\.(\d+)/.exec(ua);
        safariWasm = !!m && (+m[1] > 26 || (+m[1] === 26 && +m[2] >= 2));
      }
      window.attendixSafariWasm = safariWasm;
      var wasmGC = false;
      try {
        wasmGC = WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
      } catch (e) {}
      var link = document.createElement('link');
      link.rel = 'preload';
      if (wasmGC && (engine === 'blink' || safariWasm)) {
        link.href = 'main.dart.wasm';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
      } else {
        link.href = 'main.dart.js';
        link.as = 'script';
      }
      document.head.appendChild(link);
    })();
  </script>
  <!-- PWA_START: the engine asks for these only after main.dart.js has run
       (FontManifest → fonts → .env.app, then AssetManifest → login image),
       one round trip after another. Preloading them in parallel with the
       app code saves those round trips on a cold start. `as="fetch"` +
       `crossorigin` match the engine's fetch() so the preload is reused.
       test/web/index_preload_test.dart checks that every file exists. -->
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin="anonymous" fetchpriority="low">
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin="anonymous" fetchpriority="low">
  <link rel="preload" href="assets/assets/fonts/Roboto-Regular.ttf" as="fetch" crossorigin="anonymous" fetchpriority="low">
  <link rel="preload" href="assets/assets/fonts/Roboto-Italic.ttf" as="fetch" crossorigin="anonymous" fetchpriority="low">
  <link rel="preload" href="assets/assets/fonts/Roboto-Medium.ttf" as="fetch" crossorigin="anonymous" fetchpriority="low">
  <link rel="preload" href="assets/assets/fonts/Roboto-SemiBold.ttf" as="fetch" crossorigin="anonymous" fetchpriority="low">
  <link rel="preload" href="assets/assets/fonts/Roboto-Bold.ttf" as="fetch" crossorigin="anonymous" fetchpriority="low">
  <link rel="preload" href="assets/packages/cupertino_icons/assets/CupertinoIcons.ttf" as="fetch" crossorigin="anonymous" fetchpriority="low">
  <link rel="preload" href="assets/.env.app" as="fetch" crossorigin="anonymous" fetchpriority="low">
  <link rel="preload" href="assets/AssetManifest.bin.json" as="fetch" crossorigin="anonymous" fetchpriority="low">
  <style>
    /* Shown until Flutter paints its first frame (removed on flutter-first-frame). */
    #app-loading { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px; background: #ffffff; z-index: 0; }
    #app-loading img { width: 88px; height: 88px; border-radius: 20px; }
    #app-loading .spinner { width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(0,0,0,.12); border-top-color: #438e96; animation: app-spin .8s linear infinite; }
    @keyframes app-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      #app-loading { background: #000000; }
      #app-loading .spinner { border-color: rgba(255,255,255,.18); border-top-color: #5699a1; }
    }
    @media (prefers-reduced-motion: reduce) { #app-loading .spinner { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <div id="app-loading" role="progressbar" aria-label="Attendix wird geladen">
    <img src="icons/Icon-192.png" alt="">
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });
  </script>
  <!-- pdf.js for the in-app PDF viewer (pdfx). Loaded from a CDN, so it can
       be blocked (offline, ad blocker, firewall). Everything below is guarded:
       without pdf.js the app still starts and the PDF viewer shows a friendly
       error with an "open externally" fallback instead of crashing. -->
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module' fetchpriority='low'
    onerror="console.warn('pdf.js could not be loaded; in-app PDF viewing is disabled.')"></script>
  <script type='module'>
  globalThis.pdfRenderOptions = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  };
  try {
    var pdfjsLib = globalThis.pdfjsLib;
    if (pdfjsLib && pdfjsLib.GlobalWorkerOptions) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';
    }
  } catch (e) {
    console.warn('pdf.js setup failed', e);
  }
  </script>
  <!-- Service Worker Update Detection -->
  <script>
    // Store update status for Dart to access
    window.appUpdateAvailable = false;

    // Track if user explicitly requested update
    let userRequestedUpdate = false;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(registration => {
        // DB_REVIEW_REST (F6): like Ionic app.component checkForUpdates –
        // an update check is a CDN request, so don't poll every 30 s. Check
        // on start, when the tab becomes visible again (at most every
        // 5 minutes) and hourly while visible. Hidden tabs never check.
        var UPDATE_CHECK_INTERVAL_MS = 60 * 60 * 1000;
        var UPDATE_CHECK_MIN_GAP_MS = 5 * 60 * 1000;
        var lastUpdateCheck = 0;
        var checkForUpdate = function () {
          if (document.visibilityState !== 'visible') return;
          if (Date.now() - lastUpdateCheck < UPDATE_CHECK_MIN_GAP_MS) return;
          lastUpdateCheck = Date.now();
          registration.update().catch(function (err) {
            console.warn('[SW] update check failed', err);
          });
        };
        document.addEventListener('visibilitychange', checkForUpdate);
        setInterval(checkForUpdate, UPDATE_CHECK_INTERVAL_MS);
        checkForUpdate();

        // PWA_SW (SOL #272): a new worker may already be waiting from an
        // earlier visit (it only takes over after "Aktualisieren").
        if (registration.waiting && navigator.serviceWorker.controller) {
          window.appUpdateAvailable = true;
          window.dispatchEvent(new CustomEvent('flutter-update-available'));
        }

        // Listen for new service worker waiting
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New version available
                window.appUpdateAvailable = true;
                window.dispatchEvent(new CustomEvent('flutter-update-available'));
              }
            });
          }
        });
      });

      // Handle controller change (after skipWaiting)
      // Only reload if user explicitly clicked "Update"
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (userRequestedUpdate) {
          window.location.reload();
        }
        // Otherwise: update is ready but don't force reload
        // The user will see the dialog and can choose when to update
      });
    }

    // Function for Dart to call when user clicks "Update".
    // PWA_SW (SOL #272): the new worker waits (no mixing of two deploys in
    // one page), so it is told to take over; the controllerchange listener
    // above then reloads. A plain reload would keep the old worker.
    window.applyServiceWorkerUpdate = function() {
      userRequestedUpdate = true;
      var reload = function () { window.location.reload(); };
      if (!('serviceWorker' in navigator)) return reload();
      navigator.serviceWorker.getRegistration().then(function (registration) {
        if (!registration || !registration.waiting || !navigator.serviceWorker.controller) {
          return reload();
        }
        registration.waiting.postMessage('skipWaiting');
        setTimeout(reload, 3000); // in case controllerchange never comes
      }).catch(reload);
    };
  </script>

  <!-- TEAMS: Microsoft Teams tab support (same teams-js version as the Ionic app).
       Teams always frames the app, so the SDK is only loaded inside an iframe;
       regular browser/PWA visits load nothing. Dart reads these globals
       (lib/core/services/teams/teams_sdk_web.dart). -->
  <script>
    (function () {
      var framed;
      try {
        framed = window.self !== window.top;
      } catch (e) {
        // Cross-origin access to window.top throws – only when framed.
        framed = true;
      }
      window.attendixInIframe = framed;
      if (!framed) return;
      window.attendixTeamsSdk = new Promise(function (resolve) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@microsoft/teams-js@2.54.0/dist/umd/MicrosoftTeams.min.js';
        s.integrity = 'sha384-PIuQ2V7hlz4b1x3G1mPCYYZiWTjxzRTL6bf547xR9ARsAeNv2DAzti86LQnFCwlo';
        s.crossOrigin = 'anonymous';
        s.onload = function () { resolve(!!window.microsoftTeams); };
        s.onerror = function () { resolve(false); };
        document.head.appendChild(s);
      });
    })();
  </script>

  <!-- PWA_SW: Attendix's own service worker (tool/web/write_service_worker.dart
       writes it after the build). Registered after the first frame so it
       never delays the start; then, on every start, the active worker is
       told which files this page loaded, so one visit is enough for an
       offline start (it only stores files of its own deploy). Not inside an
       iframe (Teams tab), like Ionic. -->
  <script>
    if ('serviceWorker' in navigator && !window.attendixInIframe) {
      window.addEventListener('flutter-first-frame', function () {
        // Split so `flutter build web` does not rewrite it into its legacy
        // `?v=` registration (the worker's own content changes per deploy).
        var swUrl = 'flutter_service' + '_worker.js';
        navigator.serviceWorker.register(swUrl).catch(function (e) {
          console.warn('[SW] registration failed', e);
        });
        navigator.serviceWorker.ready.then(function (registration) {
          var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
          if (registration.active) registration.active.postMessage({ type: 'cache-urls', urls: urls });
        });
      }, { once: true });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

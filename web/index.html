  <!-- SWIPE_BACK_WEB: Safari's edge swipe (and Chrome's back gesture) slides
       the previous page in itself before it fires popstate. Mark those steps
       so the app shows the page without playing its own transition again
       (lib/core/services/browser_navigation.dart). Registered before the
       Flutter engine, so the mark is set before the app handles popstate.
       A browser that reports hasUAVisualTransition decides on its own.

       iPhone Safari also drops its snapshot right after popstate, before the
       app has drawn the page – the page swiped away flashed up for a moment.
       So the app keeps a picture of each page it leaves (last 4) and, after
       such a swipe, lays it over the app until the app has drawn the page
       (attendixUaNavShown, called from the app) or 700 ms at most. -->
  <script>
    (function () {
      // Browsers without PopStateEvent.hasUAVisualTransition: a swipe that
      // starts at the screen edge and moves (or that the browser takes over,
      // touchcancel) before popstate. A plain tap at the edge does not count.
      var EDGE = 30;
      var edgeStartX = -1;
      var edgeSwipe = false;
      var edgeEndAt = 0;
      var opts = { capture: true, passive: true };
      window.addEventListener('touchstart', function (e) {
        var t = e.touches && e.touches[0];
        edgeSwipe = false;
        edgeStartX = !!t && e.touches.length === 1 &&
          (t.clientX <= EDGE || t.clientX >= window.innerWidth - EDGE)
          ? t.clientX : -1;
      }, opts);
      window.addEventListener('touchmove', function (e) {
        var t = e.touches && e.touches[0];
        if (edgeStartX >= 0 && t && Math.abs(t.clientX - edgeStartX) > 30) {
          edgeSwipe = true;
        }
      }, opts);
      function touchDone(cancelled) {
        if (edgeStartX < 0) return;
        if (cancelled || edgeSwipe) edgeEndAt = Date.now();
        edgeStartX = -1;
        edgeSwipe = false;
      }
      window.addEventListener('touchend', function () { touchDone(false); }, opts);
      window.addEventListener('touchcancel', function () { touchDone(true); }, opts);

      // Only Safari in a browser tab swipes through the history (the home
      // screen app has no swipe; other browsers keep the page until drawn).
      var snapshots = navigator.vendor === 'Apple Computer, Inc.' &&
        navigator.maxTouchPoints > 0 && !navigator.standalone &&
        typeof createImageBitmap === 'function';
      var shots = [];
      var lastHref = location.href;
      var cover = null;
      var coverTimer = 0;
      // Account and group the pictures belong to (set by the app). A change
      // drops them, also pictures still being taken, and no pictures are
      // taken for 2 s after it (the old account's page may still be on
      // screen) nor while signed out.
      var context = '';
      var captureBlockedUntil = 0;
      window.attendixSetNavContext = function (key) {
        if (key === context) return;
        context = key;
        captureBlockedUntil = Date.now() + 2000;
        while (shots.length) {
          try { shots.pop().bitmap.close(); } catch (e) {}
        }
        removeCover();
      };

      function appCanvas() {
        var pane = document.querySelector('flt-glass-pane');
        var root = pane && (pane.shadowRoot || pane);
        var canvases = root ? root.querySelectorAll('canvas') : [];
        return canvases.length === 1 ? canvases[0] : null;
      }
      function forget(href) {
        for (var i = shots.length - 1; i >= 0; i--) {
          if (shots[i].href !== href) continue;
          try { shots[i].bitmap.close(); } catch (e) {}
          shots.splice(i, 1);
        }
      }
      function capture(href) {
        if (!context || context.indexOf('null:') === 0 ||
            Date.now() < captureBlockedUntil) return;
        var canvas = appCanvas();
        if (!canvas || !canvas.width) return;
        var takenFor = context;
        createImageBitmap(canvas).then(function (bitmap) {
          if (takenFor !== context) {
            try { bitmap.close(); } catch (e) {}
            return;
          }
          forget(href);
          shots.push({ href: href, bitmap: bitmap });
          while (shots.length > 4) {
            try { shots.shift().bitmap.close(); } catch (e) {}
          }
        }, function () {});
      }
      function removeCover(mark) {
        if (mark !== undefined && (!cover || cover.mark !== mark)) return;
        clearTimeout(coverTimer);
        if (cover && cover.parentNode) cover.parentNode.removeChild(cover);
        cover = null;
      }
      function showCover(href, mark) {
        var shot = null;
        for (var i = 0; i < shots.length; i++) {
          if (shots[i].href === href) shot = shots[i];
        }
        var canvas = appCanvas();
        if (!shot || !canvas) return;
        var rect = canvas.getBoundingClientRect();
        removeCover();
        var c = document.createElement('canvas');
        c.setAttribute('aria-hidden', 'true');
        c.width = shot.bitmap.width;
        c.height = shot.bitmap.height;
        c.style.cssText = 'position:fixed;z-index:2147483647;pointer-events:none;' +
          'left:' + rect.left + 'px;top:' + rect.top + 'px;' +
          'width:' + rect.width + 'px;height:' + rect.height + 'px;';
        try {
          c.getContext('2d').drawImage(shot.bitmap, 0, 0);
        } catch (e) {
          return;
        }
        document.body.appendChild(c);
        c.mark = mark;
        cover = c;
        coverTimer = setTimeout(removeCover, 700, mark);
      }
      // The app has drawn the page of the step with this mark (frame done,
      // two more for the GPU). An older step's call leaves a newer cover.
      window.attendixUaNavShown = function (mark) {
        if (!cover || cover.mark !== mark) return;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { removeCover(mark); });
        });
      };

      if (snapshots) {
        var push = history.pushState;
        history.pushState = function () {
          try { capture(lastHref); } catch (e) {}
          var result = push.apply(this, arguments);
          lastHref = location.href;
          return result;
        };
        var replace = history.replaceState;
        history.replaceState = function () {
          var result = replace.apply(this, arguments);
          lastHref = location.href;
          return result;
        };
      }

      window.addEventListener('popstate', function (e) {
        var browserAnimated = 'hasUAVisualTransition' in e
          ? e.hasUAVisualTransition === true
          : edgeSwipe || Date.now() - edgeEndAt < 1000;
        edgeEndAt = 0;
        edgeStartX = -1;
        edgeSwipe = false;
        if (browserAnimated) {
          // Also the id of this step (strictly increasing).
          window.attendixUaNavAt =
            Math.max(Date.now(), (window.attendixUaNavAt || 0) + 1);
        }
        if (snapshots) {
          try {
            // The page being left, for a swipe forward again.
            if (browserAnimated) capture(lastHref);
            if (browserAnimated) showCover(location.href, window.attendixUaNavAt);
          } catch (err) {}
          lastHref = location.href;
        }
      }, true);
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <!-- Start loading the app code right away, in parallel with the bootstrap
       script (it would otherwise only be requested after flutter_bootstrap.js).
       PWA_WASM: preload the variant Flutter's loader will pick – WebAssembly
       for Chrome/Edge (and Safari 26.2+), JavaScript elsewhere – with the same
       browser checks as flutter.js, so no browser downloads both. -->
  <script>
    (function () {
      var ua = navigator.userAgent;
      var engine = navigator.vendor === 'Google Inc.' || ua.indexOf('Edg/') >= 0
        ? 'blink'
        : navigator.vendor === 'Apple Computer, Inc.' ? 'webkit' : 'other';
      var safariWasm = false;
      if (engine === 'webkit') {
        // PERF_WEB: the installed iPhone/iPad web app (home screen) and
        // in-app browsers send no "Version/x.y" – there WebKit is the iOS
        // version ("CPU iPhone OS 26_2"), so those get WebAssembly too.
        var m = /Version\/(\d+)\.(\d+)/.exec(ua) ||
          /\bCPU (?:iPhone )?OS (\d+)_(\d+)/.exec(ua);
        safariWasm = !!m && (+m[1] > 26 || (+m[1] === 26 && +m[2] >= 2));
      }
      window.attendixSafariWasm = safariWasm;
      var wasmGC = false;
      try {
        wasmGC = WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
      } catch (e) {}
      // PWA_SW: the engine files of this variant (flutter.js picks skwasm /
      // skwasm_heavy and CanvasKit full / chromium with these checks). A new
      // deploy's waiting service worker caches them even when this page still
      // runs the previous deploy (web/index.html, 'cache-urls').
      var codecs = typeof ImageDecoder !== 'undefined' && engine === 'blink';
      var breakIterators = typeof Intl.v8BreakIterator !== 'undefined' &&
        typeof Intl.Segmenter !== 'undefined';
      var link = document.createElement('link');
      link.rel = 'preload';
      if (wasmGC && (engine === 'blink' || safariWasm)) {
        link.href = 'main.dart.wasm';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        // Safari does not reuse this preload for the engine's fetch and
        // downloads the 10 MB twice (seen in Safari 26.2 and 27), so only
        // Chrome/Edge get it.
        if (engine !== 'blink') link = null;
        var skwasm = codecs && breakIterators ? 'canvaskit/skwasm' : 'canvaskit/skwasm_heavy';
        window.attendixEngineFiles = ['main.dart.wasm', 'main.dart.mjs', skwasm + '.js', skwasm + '.wasm'];
      } else {
        link.href = 'main.dart.js';
        link.as = 'script';
        var canvaskit = codecs && breakIterators ? 'canvaskit/chromium/canvaskit' : 'canvaskit/canvaskit';
        window.attendixEngineFiles = ['main.dart.js', canvaskit + '.js', canvaskit + '.wasm'];
      }
      if (link) document.head.appendChild(link);
    })();
  </script>
  <!-- PWA_START: the engine asks for these only after main.dart.js has run
       (FontManifest → fonts → .env.app, then AssetManifest → login image),
       one round trip after another. Preloading them in parallel with the
       app code saves those round trips on a cold start. `as="fetch"` +
       `crossorigin` match the engine's fetch() so Chrome/Edge reuse the
       preload. Safari (26.2, 27) does not and loads every file twice, so
       only Blink gets them. test/web/index_preload_test.dart checks that
       every file exists. -->
  <script>
    (function () {
      var ua = navigator.userAgent;
      if (navigator.vendor !== 'Google Inc.' && ua.indexOf('Edg/') < 0) return;
      var assetPreloads = [
        'assets/FontManifest.json',
        'assets/fonts/MaterialIcons-Regular.otf',
        'assets/assets/fonts/Roboto-Regular.ttf',
        'assets/assets/fonts/Roboto-Italic.ttf',
        'assets/assets/fonts/Roboto-Medium.ttf',
        'assets/assets/fonts/Roboto-SemiBold.ttf',
        'assets/assets/fonts/Roboto-Bold.ttf',
        'assets/packages/cupertino_icons/assets/CupertinoIcons.ttf',
        'assets/.env.app',
        'assets/AssetManifest.bin.json',
      ];
      assetPreloads.forEach(function (href) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.href = href;
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.fetchPriority = 'low';
        document.head.appendChild(link);
      });
    })();
  </script>

    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  };
  try {
    var pdfjsLib = globalThis.pdfjsLib;
    if (pdfjsLib && pdfjsLib.GlobalWorkerOptions) {

  <!-- Service Worker Update Detection -->
  <script>
    // Store update status for Dart to access
    window.appUpdateAvailable = false;

    // Track if user explicitly requested update
    let userRequestedUpdate = false;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(registration => {
        // DB_REVIEW_REST (F6): like Ionic app.component checkForUpdates –
        // an update check is a CDN request, so don't poll every 30 s. Check
        // on start, when the tab becomes visible again (at most every
        // 5 minutes) and hourly while visible. Hidden tabs never check.
        var UPDATE_CHECK_INTERVAL_MS = 60 * 60 * 1000;
        var UPDATE_CHECK_MIN_GAP_MS = 5 * 60 * 1000;
        var lastUpdateCheck = 0;
        var checkForUpdate = function () {
          if (document.visibilityState !== 'visible') return;
          if (Date.now() - lastUpdateCheck < UPDATE_CHECK_MIN_GAP_MS) return;
          lastUpdateCheck = Date.now();
          registration.update().catch(function (err) {
            console.warn('[SW] update check failed', err);
          });
        };
        document.addEventListener('visibilitychange', checkForUpdate);
        setInterval(checkForUpdate, UPDATE_CHECK_INTERVAL_MS);
        checkForUpdate();

        var notifyUpdate = function () {
          if (window.appUpdateAvailable) return;
          window.appUpdateAvailable = true;
          window.dispatchEvent(new CustomEvent('flutter-update-available'));
        };
        // New version available once a new worker is installed (it waits).
        var watchInstalling = function (worker) {
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              notifyUpdate();
            }
          });
        };

        // PWA_SW (SOL #272): a new worker may already be waiting from an
        // earlier visit, or still be installing – its updatefound has then
        // already fired.
        // PWA_UPDATE: the web app shows no hint, only "Update installieren"
        // in the settings; a waiting worker takes over at the next start
        // (see the start script at the end of the body).
        if (registration.waiting && navigator.serviceWorker.controller) {
          notifyUpdate();
        }
        watchInstalling(registration.installing);
        registration.addEventListener('updatefound', () => {
          watchInstalling(registration.installing);
        });
      });

      // Handle controller change (after skipWaiting).
      // PWA_SW (SOL #272): a new deploy only takes over after "Aktualisieren"
      // (in this or another tab), so every tab that ran under the previous
      // worker reloads – no page keeps running old code under the new one.
      // The first worker of a fresh visit (no controller before) is no
      // version change and reloads nothing – but every later change does
      // (tool/web/test/sw_behavior.test.mjs). The new worker also reloads
      // tabs of the previous deploy itself (activate), for tabs whose page
      // still has an older version of this handler.
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (userRequestedUpdate || hadController) {
          window.location.reload();
        }
        hadController = true;
      });
    }

    // Function for Dart to call when user clicks "Update installieren".
    // PWA_SW (SOL #272): the new worker waits (no mixing of two deploys in
    // one page), so it is told to take over; the controllerchange listener
    // above then reloads. A plain reload would keep the old worker.
    window.applyServiceWorkerUpdate = function() {
      userRequestedUpdate = true;
      var reload = function () { window.location.reload(); };
      if (!('serviceWorker' in navigator)) return reload();
      navigator.serviceWorker.getRegistration().then(function (registration) {
        if (!registration || !registration.waiting || !navigator.serviceWorker.controller) {
          return reload();
        }
        registration.waiting.postMessage('skipWaiting');
        setTimeout(reload, 3000); // in case controllerchange never comes
      }).catch(reload);
    };
  </script>

  <!-- TEAMS: Microsoft Teams tab support (same teams-js version as the Ionic app).
       Teams always frames the app, so the SDK is only loaded inside an iframe;
       regular browser/PWA visits load nothing. Dart reads these globals
       (lib/core/services/teams/teams_sdk_web.dart). -->
  <script>
    (function () {
      var framed;
      try {
        framed = window.self !== window.top;
      } catch (e) {
        // Cross-origin access to window.top throws – only when framed.
        framed = true;
      }
      window.attendixInIframe = framed;
      if (!framed) return;
      window.attendixTeamsSdk = new Promise(function (resolve) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@microsoft/teams-js@2.54.0/dist/umd/MicrosoftTeams.min.js';
        s.integrity = 'sha384-PIuQ2V7hlz4b1x3G1mPCYYZiWTjxzRTL6bf547xR9ARsAeNv2DAzti86LQnFCwlo';
        s.crossOrigin = 'anonymous';
        s.onload = function () { resolve(!!window.microsoftTeams); };
        s.onerror = function () { resolve(false); };
        document.head.appendChild(s);
      });
    })();
  </script>

  <!-- PWA_SW: Attendix's own service worker (tool/web/write_service_worker.dart
       writes it after the build). Registered after the first frame so it
       never delays the start. On every start each worker of the registration
       is told which files this page needs: an installing one only finishes
       with all of them (complete offline start before it can take over), the
       active one fills gaps. The list holds the files the page loaded plus
       the engine files of this browser's variant (window.attendixEngineFiles).
       Not inside an iframe (Teams tab), like Ionic. -->
  <script>
    if ('serviceWorker' in navigator && !window.attendixInIframe) {
      window.addEventListener('flutter-first-frame', function () {
        var postUrls = function (worker) {
          if (!worker) return;
          var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
          (window.attendixEngineFiles || []).forEach(function (file) {
            urls.push(new URL(file, document.baseURI).href);
          });
          worker.postMessage({ type: 'cache-urls', urls: urls });
        };
        var postAll = function (registration) {
          postUrls(registration.installing);
          postUrls(registration.waiting);
          postUrls(registration.active);
        };
        var listen = function (registration) {
          if (!registration) return;
          postAll(registration);
          registration.addEventListener('updatefound', function () {
            postUrls(registration.installing);
          });
        };
        // An existing registration first: register() waits in the browser's
        // job queue behind a running install, and that install waits for
        // this list.
        navigator.serviceWorker.getRegistration().then(listen);
        // Split so `flutter build web` does not rewrite it into its legacy
        // `?v=` registration (the worker's own content changes per deploy).
        var swUrl = 'flutter_service' + '_worker.js';
        navigator.serviceWorker.register(swUrl).then(postAll).catch(function (e) {
          console.warn('[SW] registration failed', e);
        });
      }, { once: true });
    }
  </script>

  <!-- PWA_UPDATE: updates happen at a (re)start, never during use. Closing
       the app lets a waiting worker take over by itself; a reload does not,
       so a page that starts while a new worker waits asks it first
       ('activate-if-alone'). Only if this is the app's only window does it
       let the worker take over ('skipWaiting'); controllerchange then
       reloads into the new version. The app itself only starts once that is
       decided, so no reload can hit a page in use (SOL #274). -->
  <script>
    (function () {
      var started = false;
      var start = function () {
        if (started) return;
        started = true;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      };
      var sw = navigator.serviceWorker;
      if (!sw || !sw.controller) return start();
      sw.getRegistration().then(function (registration) {
        var waiting = registration && registration.waiting;
        if (!waiting) return start();
        var switching = false;
        sw.addEventListener('message', function (event) {
          var type = event.data && event.data.type;
          if (type === 'stay') start();
          // Only before the app started: afterwards the page is in use.
          if (type === 'alone' && !started && !switching) {
            switching = true;
            // controllerchange reloads; should it never come, start anyway.
            setTimeout(start, 10000);
            try {
              waiting.postMessage('skipWaiting');
            } catch (e) {
              start(); // replaced by a newer deploy meanwhile (SOL #274)
            }
          }
        });
        sw.startMessages();
        waiting.postMessage({ type: 'activate-if-alone' });
        // No answer: start this version (the update waits for the next start).
        setTimeout(function () { if (!switching) start(); }, 3000);
      }).catch(start);
    })();
  </script>

<ion-header translucent="true">
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-button (click)="navigateBack()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ 'help.glossary' | transloco }}</ion-title>
  </ion-toolbar>
  <ion-toolbar color="light">
    <ion-searchbar [value]="searchTerm" (ionInput)="search($event)" debounce="150"
      [placeholder]="'help.searchTerm' | transloco"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content color="light" [fullscreen]="true">
  <ion-list [inset]="true">
    @if (!filteredTerms.length) {
      <ion-item lines="none">
        <ion-label class="ion-text-wrap">{{ 'help.noTerms' | transloco }}</ion-label>
      </ion-item>
    }
    <ion-accordion-group [multiple]="true">
      @for (term of filteredTerms; track term.id) {
        <ion-accordion [value]="term.id">
          <ion-item slot="header">
            <ion-label>{{ term.term }}</ion-label>
          </ion-item>
          <div slot="content" class="ion-padding" [innerHTML]="definitionHtml(term)"></div>
        </ion-accordion>
      }
    </ion-accordion-group>
  </ion-list>
</ion-content>

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" defaultHref="/tabs/settings"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'teamOrg.title' | transloco }}</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [value]="activeSegment" (ionChange)="onSegmentChange($event)">
      <ion-segment-button value="tasks">
        <ion-label>{{ 'teamOrg.tabTasks' | transloco }}</ion-label>
      </ion-segment-button>
      <ion-segment-button value="topics">
        <ion-label>{{ 'teamOrg.tabTopics' | transloco }}</ion-label>
      </ion-segment-button>
      <ion-segment-button value="protocols">
        <ion-label>{{ 'teamOrg.tabProtocols' | transloco }}</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="tabbar-safe">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @switch (activeSegment) {
    @case ('tasks') { <app-team-tasks-tab></app-team-tasks-tab> }
    @case ('topics') { <app-team-topics-tab></app-team-topics-tab> }
    @case ('protocols') { <app-team-protocols-tab></app-team-protocols-tab> }
  }
</ion-content>

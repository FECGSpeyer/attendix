name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          # DEMO_GUARD: optional demo account ("Demo starten", write-protected)
          echo "DEMO_EMAIL=${{ secrets.DEMO_EMAIL }}" >> .env
          echo "DEMO_PASSWORD=${{ secrets.DEMO_PASSWORD }}" >> .env

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href /

      - name: Deploy to Cloudflare Pages
        # cloudflare/pages-action is no longer resolvable; wrangler-action is its successor
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Preview deployments for PRs, production for main
          command: pages deploy build/web --project-name=attendix --branch=${{ github.head_ref || github.ref_name }}

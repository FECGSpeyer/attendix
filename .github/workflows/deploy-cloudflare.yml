name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
    # Docs-only changes need no build or deploy.
    paths-ignore: ['**/*.md', 'docs/**']
  # PRs get no preview by default (it took ~5 min per push and is not needed
  # for merging: CI's Analyze and Test cover the code, and a failing master
  # build keeps the last production deploy online). A preview is built only
  # for PRs with the label "preview", or by hand via "Run workflow" on a branch.
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

# PR previews (group per PR number): a new push cancels the running preview.
# master: a running deploy is never cancelled, so the version job below never
# races itself. GitHub keeps only the newest WAITING run of a group; that is
# intended: the waiting run checks out the latest master, so it releases all
# pending fragments and deploys every commit the replaced run would have.
# Adding any other label to a PR gets a group of its own (run_id), so it does
# not cancel a running preview; its run skips the build anyway.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' && github.event.label.name != 'preview' && github.run_id || format('pr-{0}', github.event.pull_request.number)) || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    # Version at merge time: PRs only add changelog/unreleased/*.json; this
    # job turns all pending fragments on master into one version bump commit
    # (tool/release/release_version.py). A push with GITHUB_TOKEN starts no
    # new workflow run, so the build below deploys that commit directly.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Release version from changelog fragments
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            version=$(python3 tool/release/release_version.py)
            if [ -z "$version" ]; then
              echo "No changelog fragments, version unchanged"
              break
            fi
            git add -A pubspec.yaml lib/core/constants/app_constants.dart \
              assets/version_history.json changelog/unreleased
            git commit -m "Version $version"
            if git push origin HEAD:master; then
              echo "Released $version"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "Push of version $version failed three times" >&2
              exit 1
            fi
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: version
    # PRs: only with the label "preview" (adding the label starts it).
    # Runs when the version job succeeded or was skipped (PRs, other branches),
    # and also when it failed: a missing version bump must not stop the
    # production deploy (the red version job still shows in the run).
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'preview')
      && (github.event.action != 'labeled' || github.event.label.name == 'preview'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # master: the commit with the new version; otherwise (and when the
          # version job failed) the default commit.
          ref: ${{ needs.version.outputs.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          # Error monitoring: optional repo secret SENTRY_DSN (no DSN = off).
          # Previews (PRs, hand-started branch runs) report as "preview",
          # master as "production".
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          echo "SENTRY_ENVIRONMENT=${{ github.ref == 'refs/heads/master' && 'production' || 'preview' }}" >> .env
          # DEMO_GUARD: optional demo account ("Demo starten", write-protected)
          # Repo secrets may be named DEMO_EMAIL/DEMO_PASSWORD or DEMOMAIL/DEMOPASSWORD.
          # Passed via env and single-quoted: flutter_dotenv treats an unquoted '#' as a
          # comment start and interpolates '$' (the demo password contains '#').
          printf "DEMO_EMAIL='%s'\n" "$DEMO_EMAIL" >> .env
          printf "DEMO_PASSWORD='%s'\n" "$DEMO_PASSWORD" >> .env
          # The app bundles only .env.app (never the developer's .env, which
          # may hold server-side keys such as SUPABASE_SERVICE_ROLE_KEY).
          cp .env .env.app
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL || secrets.DEMOMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD || secrets.DEMOPASSWORD }}

      # No `flutter test` here: the CI workflow tests every PR and every
      # master push in parallel, so this job only builds and deploys.

      - name: Build web
        # PWA_OFFLINE: CanvasKit from our own origin instead of gstatic.com,
        # so the service worker caches it and the installed PWA starts
        # offline like the Ionic PWA (the SW only caches same-origin files).
        # PWA_WASM: --wasm builds a WebAssembly variant next to the JavaScript
        # one; Flutter's loader picks it per browser (web/flutter_bootstrap.js).
        run: flutter build web --release --base-href / --no-web-resources-cdn --wasm

      - name: Write service worker
        # PWA_SW: Flutter 3.47 only ships a self-unregistering worker; write
        # Attendix's own (offline start, update notice) over it.
        run: |
          dart run tool/web/write_service_worker.dart build/web
          grep -q "attendix-app-cache" build/web/flutter_service_worker.js

      - name: Verify Cloudflare _headers (Teams frame-ancestors)
        # flutter build web copies web/* into build/web; fail loudly if not.
        run: |
          test -f build/web/_headers || cp web/_headers build/web/_headers
          grep -q "frame-ancestors" build/web/_headers

      - name: Verify Universal Link files (.well-known)
        # iOS (AASA) and Android (assetlinks.json) fetch these for Universal
        # Links / App Links and password suggestions. Same fallback as _headers,
        # then fail if a file is missing, not JSON or lacks the app IDs.
        run: |
          mkdir -p build/web/.well-known
          for f in apple-app-site-association assetlinks.json; do
            test -f "build/web/.well-known/$f" || cp "web/.well-known/$f" "build/web/.well-known/$f"
          done
          bash tool/release/check_well_known.sh build/web

      - name: Deploy to Cloudflare Pages
        # cloudflare/pages-action is no longer resolvable; wrangler-action is its successor
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Preview deployments for PRs, production for main
          command: pages deploy build/web --project-name=attendix --branch=${{ github.head_ref || github.ref_name }}

      - name: Deploy to own VPS
        # VPS_HOSTING: master builds also go to the own VPS (deploy/vps/web,
        # nginx + link preview behind Traefik). Skipped until the secret
        # VPS_HOST is set. Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY,
        # VPS_WEB_DIR (e.g. /opt/attendix/web/www), optional VPS_KNOWN_HOSTS.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_WEB_DIR: ${{ secrets.VPS_WEB_DIR }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "VPS_HOST not set, skipping VPS deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_vps
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            hostcheck=yes
          else
            hostcheck=accept-new
          fi
          # --delay-updates: files switch over together at the end, so no
          # visitor gets a mix of old and new build files.
          rsync -az --delete --delay-updates \
            -e "ssh -i ~/.ssh/id_vps -o StrictHostKeyChecking=$hostcheck" \
            build/web/ "$VPS_USER@$VPS_HOST:$VPS_WEB_DIR/"

name: Update Linux Goldens

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-goldens:
    name: Generate Linux Golden PNGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup test environment
        run: cp .env.example .env && cp .env.example .env.app

      - name: Update golden images
        run: flutter test test/golden --update-goldens

      - name: Upload updated golden PNGs
        uses: actions/upload-artifact@v4
        with:
          name: updated-linux-goldens
          path: test/golden/goldens/*.png
          retention-days: 7

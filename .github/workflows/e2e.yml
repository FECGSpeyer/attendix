name: E2E

# Runs the flows in patrol_test/ against the real app and a LOCAL Supabase
# that is started fresh inside this job (e2e/supabase). Its tables, rules and
# test data come from the private repository attendix-db. Nothing here talks
# to the production database.
#
# - Pull requests: the flows tagged "pr" (a handful, the most important
#   paths). All flows when the pull request changes the flows themselves or
#   carries the label "e2e-alle".
# - Every night and by hand ("Run workflow"): all flows.
on:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog/**'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PATROL_CLI_VERSION: '4.9.0'
  SUPABASE_CLI_VERSION: '2.33.9'
  PATROL_ANALYTICS_ENABLED: 'false'

jobs:
  web:
    name: Web (Chromium)
    # Patrol pins a Playwright version; it must support the runner image.
    # The test database needs a secret, which pull requests from forks and
    # from Dependabot do not get.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the test database (private)
        uses: actions/checkout@v4
        with:
          repository: FECGSpeyer/attendix-db
          ssh-key: ${{ secrets.ATTENDIX_DB_DEPLOY_KEY }}
          path: .attendix-db
          persist-credentials: false

      - name: Read Flutter version from ci.yml
        id: flutter
        run: |
          version=$(sed -n "s/^ *flutter-version: *['\"]\{0,1\}\([0-9][0-9.]*\)['\"]\{0,1\} *$/\1/p" .github/workflows/ci.yml | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: |
          supabase start --workdir e2e -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
          supabase status --workdir e2e -o env > "$RUNNER_TEMP/supabase.env"

      - name: Load tables, rules and test data
        # The schema is private and this log is public: nothing of the
        # loading is printed here.
        run: |
          source "$RUNNER_TEMP/supabase.env"
          export SCHEMA_ADMIN_URL="${DB_URL/\/\/postgres:/\/\/supabase_admin:}"
          if ! .attendix-db/scripts/build_test_db.sh "$DB_URL" > "$RUNNER_TEMP/db.log" 2>&1; then
            echo "Loading the test database failed. Details: workflow Datenbank-Regeln in attendix-db." >&2
            exit 1
          fi

      - name: Point the app at the local Supabase
        run: |
          source "$RUNNER_TEMP/supabase.env"
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env.app
          cp .env.app .env

      - name: Get dependencies
        run: |
          flutter pub get
          dart pub global activate patrol_cli "$PATROL_CLI_VERSION"

      - name: Run flows
        env:
          PATROL_WEB_LOCALE: de-DE
          PATROL_WEB_TIMEZONE: Europe/Berlin
          PATROL_WEB_VIEWPORT: '{"width":1280,"height":800}'
          PATROL_WEB_SCREENSHOT: only-on-failure
          PATROL_WEB_REPORTER: '["list","html"]'
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=()
          if [ "${{ github.event_name }}" = pull_request ] && [[ ",$PR_LABELS," != *,e2e-alle,* ]]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename')
            if ! grep -qE '^(patrol_test/|e2e/|\.github/workflows/e2e\.yml$)' <<< "$files"; then
              tags=(--tags pr)
            fi
          fi
          patrol test --device chrome --web-headless "${tags[@]}"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android (Emulator)
    # Slow (build and emulator, about 15 minutes), so not on every pull
    # request: by hand via "Run workflow", or on pull requests that carry the
    # label "e2e-android" (set the label before the push). Runs the flows
    # tagged "mobil": the others are written for a wide window.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-android')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the test database (private)
        uses: actions/checkout@v4
        with:
          repository: FECGSpeyer/attendix-db
          ssh-key: ${{ secrets.ATTENDIX_DB_DEPLOY_KEY }}
          path: .attendix-db
          persist-credentials: false

      - name: Read Flutter version from ci.yml
        id: flutter
        run: |
          version=$(sed -n "s/^ *flutter-version: *['\"]\{0,1\}\([0-9][0-9.]*\)['\"]\{0,1\} *$/\1/p" .github/workflows/ci.yml | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: |
          supabase start --workdir e2e -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
          supabase status --workdir e2e -o env > "$RUNNER_TEMP/supabase.env"

      - name: Load tables, rules and test data
        # The schema is private and this log is public: nothing of the
        # loading is printed here.
        run: |
          source "$RUNNER_TEMP/supabase.env"
          export SCHEMA_ADMIN_URL="${DB_URL/\/\/postgres:/\/\/supabase_admin:}"
          if ! .attendix-db/scripts/build_test_db.sh "$DB_URL" > "$RUNNER_TEMP/db.log" 2>&1; then
            echo "Loading the test database failed. Details: workflow Datenbank-Regeln in attendix-db." >&2
            exit 1
          fi

      - name: Point the app at the local Supabase
        # 10.0.2.2 is this machine as the emulator sees it.
        run: |
          source "$RUNNER_TEMP/supabase.env"
          port=${API_URL##*:}
          printf 'SUPABASE_URL=http://10.0.2.2:%s\nSUPABASE_ANON_KEY=%s\n' "$port" "$ANON_KEY" > .env.app
          cp .env.app .env

      - name: Get dependencies
        run: |
          flutter pub get
          dart pub global activate patrol_cli "$PATROL_CLI_VERSION"

      - name: Remove broken preinstalled NDK directories
        run: |
          for d in "${ANDROID_SDK_ROOT:-}"/ndk/* "${ANDROID_HOME:-}"/ndk/*; do
            if [ -d "$d" ] && [ ! -f "$d/source.properties" ]; then
              echo "Removing broken NDK directory without source.properties: $d"
              rm -rf "$d"
            fi
          done

      - name: Build app and flows
        run: patrol build android

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # On a failure the crashes the device recorded and what the app
          # itself said last go into the job log.
          script: |
            adb logcat -G 16M
            patrol test --device emulator-5554 --tags mobil || (adb logcat -b crash -d | tail -n 150; adb logcat -d -v brief flutter:V ActivityManager:W TestRunner:V '*:S' | tail -n 150; exit 1)

      - name: Show failed flows
        if: ${{ failure() }}
        run: |
          find build/app/outputs/androidTest-results -name '*.xml' -print0 2>/dev/null \
            | xargs -0 -r grep -h -A30 -E '<(failure|error)' | head -n 100 || true
          # Each flow leaves a device log next to the results.
          find build/app/outputs -name '*.txt' -path '*ndroid*est*' | while read -r file; do
            echo "== $file"
            grep -E 'FATAL|AndroidRuntime|flutter|signal [0-9]+|Abort message|has died' "$file" | tail -n 80 || true
          done

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-report
          path: |
            build/app/reports/androidTests
            build/app/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 7

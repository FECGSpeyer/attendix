name: CI

on:
  push:
    branches: [master, develop]
    # Docs-only changes need no build or tests.
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**']

# A new push to a PR cancels its still-running CI. Pushes (master, develop)
# get a group of their own (run_id), so they are never cancelled or replaced.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: dart analyze lib/ test/ tool/ scripts/ patrol_test/ --fatal-infos --fatal-warnings

      - name: Check changelog fragments
        # PRs add changelog/unreleased/*.json instead of bumping the version;
        # the deploy workflow turns them into a version after the merge.
        run: python3 tool/release/release_version.py --check

      - name: Check app texts quoted in the Beta docs
        # docs/beta quotes buttons and titles of the app; a renamed text
        # shows up here so the docs are updated in the same PR.
        run: python3 tool/docs/check_app_texts.py --strict

      - name: Run Python test dashboard unit tests
        run: python3 -m unittest tool/testing/test_dashboard.py

  test-shard:
    # The suite (~365 files) is split over 4 runners; most of the time is
    # compiling each test file, so 4 shards take about a quarter of it.
    name: Test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup test environment
        run: cp .env.example .env && cp .env.example .env.app

      - name: Run tests
        # Whole files per shard (every 4th file). flutter test's own
        # --total-shards splits test cases instead, so every shard would
        # still compile all files and tests within a file could land on
        # different shards. Coverage stays off (Flutter segfault on Ubuntu).
        # Run in a single flutter test invocation so the JSON reporter output
        # is never overwritten by multiple xargs chunks.
        run: |
          find test -name '*_test.dart' | sort \
            | awk -v n=4 -v i=${{ matrix.shard }} 'NR % n == i % n' > shard.txt
          echo "$(wc -l < shard.txt) test files in this shard"
          mapfile -t test_files < shard.txt
          flutter test --file-reporter "json:test-results-shard-${{ matrix.shard }}.json" "${test_files[@]}"

      - name: Upload shard test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload golden failures
        # Expected picture, actual picture and their difference for every
        # golden image that no longer matches (test/golden/README.md).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.shard }}
          path: test/golden/failures/
          if-no-files-found: ignore

  test:
    # One "Test" check that is green only when every shard passed.
    name: Test
    needs: test-shard
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download shard test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: test-results-shard-*
          path: shard-results

      - name: Generate test dashboard and step summary
        if: always()
        run: |
          shopt -s nullglob globstar
          results=(shard-results/**/test-results-shard-*.json)
          args=(--expected-results 4 --html build/test-dashboard/index.html --embed-goldens --markdown "$GITHUB_STEP_SUMMARY")
          if (( ${#results[@]} > 0 )); then
            args=(--results "${results[@]}" "${args[@]}")
          fi
          python3 tool/testing/generate_test_dashboard.py "${args[@]}"

      - name: Upload test dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-dashboard
          path: build/test-dashboard/index.html
          if-no-files-found: ignore
          retention-days: 14

      - name: All shards passed
        run: test "${{ needs.test-shard.result }}" = success

  pages-dashboard:
    name: Publish Test Dashboard
    needs: test
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-test-dashboard
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download test dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: test-dashboard
          path: site

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

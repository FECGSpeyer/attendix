name: CI

on:
  push:
    branches: [master, develop]
    # Docs-only changes need no build or tests.
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**']

# A new push to a PR cancels its still-running CI. Pushes (master, develop)
# get a group of their own (run_id), so they are never cancelled or replaced.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: dart analyze lib/ --fatal-warnings

      - name: Check changelog fragments
        # PRs add changelog/unreleased/*.json instead of bumping the version;
        # the deploy workflow turns them into a version after the merge.
        run: python3 tool/release/release_version.py --check

  test-shard:
    # The suite (~365 files) is split over 4 runners; most of the time is
    # compiling each test file, so 4 shards take about a quarter of it.
    name: Test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup test environment
        run: cp .env.example .env && cp .env.example .env.app

      - name: Run tests
        # Whole files per shard (every 4th file). flutter test's own
        # --total-shards splits test cases instead, so every shard would
        # still compile all files and tests within a file could land on
        # different shards. Coverage stays off (Flutter segfault on Ubuntu).
        run: |
          find test -name '*_test.dart' | sort \
            | awk -v n=4 -v i=${{ matrix.shard }} 'NR % n == i % n' > shard.txt
          echo "$(wc -l < shard.txt) test files in this shard"
          xargs flutter test < shard.txt

  test:
    # One "Test" check that is green only when every shard passed.
    name: Test
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.test-shard.result }}" = success

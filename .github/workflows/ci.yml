name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

# A new push to a PR cancels its still-running CI. Pushes (master, develop)
# get a group of their own (run_id), so they are never cancelled or replaced.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: dart analyze lib/ --fatal-warnings

      - name: Check changelog fragments
        # PRs add changelog/unreleased/*.json instead of bumping the version;
        # the deploy workflow turns them into a version after the merge.
        run: python3 tool/release/release_version.py --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup test environment
        run: cp .env.example .env && cp .env.example .env.app

      - name: Run tests
        run: flutter test
        # Note: Coverage disabled due to Flutter 3.29.0 segmentation fault bug
        # when running `flutter test --coverage` on Ubuntu runners.
        # Re-enable when Flutter fixes this issue.

      # Coverage temporarily disabled - see above
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v4
      #   with:
      #     file: coverage/lcov.info
      #     fail_ci_if_error: false
      #   continue-on-error: true

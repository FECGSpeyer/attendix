name: Bildvergleich

# Shows changed golden images (test/golden/goldens) as before and after in
# one comment on the pull request, so a visual change can be judged without
# checking out the branch. No code of the pull request runs here: the job
# only reads the list of changed files and links the pictures of both commits.

on:
  pull_request:
    branches: [master]
    paths: ['test/golden/goldens/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: golden-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    name: Vorher und Nachher
    runs-on: ubuntu-latest
    # Pull requests from forks get a read-only token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Post the changed pictures
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- golden-preview -->';
            const folder = 'test/golden/goldens/';
            const limit = 30;
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const files = (await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            })).filter((f) => f.filename.startsWith(folder) && f.filename.endsWith('.png'));

            // "Before" is the commit the branch started from, not today's master.
            const compare = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${pr.base.sha}...${pr.head.sha}`, per_page: 1,
            });
            const before = compare.data.merge_base_commit.sha;
            const after = pr.head.sha;

            const raw = (sha, path) =>
              `https://raw.githubusercontent.com/${owner}/${repo}/${sha}/${encodeURI(path)}`;
            const img = (sha, path) => `<img width="360" src="${raw(sha, path)}">`;
            const name = (path) => path.slice(folder.length).replace(/\.png$/, '');

            const changed = files.filter((f) => f.status === 'modified' || f.status === 'changed');
            const added = files.filter((f) => f.status === 'added');
            const removed = files.filter((f) => f.status === 'removed');

            const lines = [marker, '### Bildvergleich', ''];
            const shown = [...changed, ...added].slice(0, limit);
            if (changed.length > 0) {
              lines.push(`**${changed.length} geändert.** Links der Stand vor diesem PR, rechts danach.`, '');
            }
            for (const f of shown) {
              const isNew = f.status === 'added';
              lines.push(
                `<details open><summary><b>${name(f.filename)}</b>${isNew ? ' (neu)' : ''}</summary>`,
                '',
                isNew ? '| Neu |' : '| Vorher | Nachher |',
                isNew ? '|---|' : '|---|---|',
                isNew
                  ? `| ${img(after, f.filename)} |`
                  : `| ${img(before, f.filename)} | ${img(after, f.filename)} |`,
                '',
                '</details>',
                '',
              );
            }
            const hidden = changed.length + added.length - shown.length;
            if (hidden > 0) {
              lines.push(`Dazu ${hidden} weitere Bilder, siehe „Files changed“.`, '');
            }
            if (removed.length > 0) {
              lines.push(`Entfernt: ${removed.map((f) => `\`${name(f.filename)}\``).join(', ')}`, '');
            }
            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

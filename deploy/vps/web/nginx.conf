# Attendix web (build/web) on the own VPS, behind Traefik.
# Mirrors web/_headers (Cloudflare Pages) and functions/register/[id].js.

# Cloudflare Pages default: revalidate every file (names are not hashed).
map $uri $attendix_cache_control {
    default                 "public, max-age=0, must-revalidate";
    ~^/icons/               "public, max-age=604800";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # application/wasm comes from nginx's mime.types (nginx >= 1.21).

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;

    # COOP/COEP for Skwasm multi-threading, frame-ancestors for Teams (see web/_headers).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "frame-ancestors 'self' *.cloud.microsoft teams.microsoft.com *.teams.microsoft.com *.microsoft365.com *.office.com *.skype.com *.teams.microsoft.us *.gov.teams.microsoft.us local.teams.office.com;" always;
    add_header Cache-Control $attendix_cache_control always;

    # Apple requires the AASA file (no extension) as JSON.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # Invitation links: link-preview service puts the group name into the
    # Open Graph tags. If it is down, the plain app page is served.
    location ^~ /register/ {
        proxy_pass http://attendix-link-preview:8080;
        proxy_intercept_errors on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        error_page 502 503 504 = @app;
    }

    location @app {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
